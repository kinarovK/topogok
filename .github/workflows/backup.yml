# Weekly backup of the production database into one of four rotating backup databases
# (topogok-backup-1..4, Cloudflare D1, free plan). Personal data stays within Cloudflare: the export
# exists only on this ephemeral runner and is never uploaded as an artifact. Restore: OPERATIONS.md.
name: backup

on:
  schedule:
    - cron: '17 2 * * 0'   # Sundays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.160.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
      - name: Export production
        run: npx --yes "$WRANGLER" d1 export topogok-prod --remote --output prod.sql
      - name: Check the export
        # Counts only: table, parent and row number of each broken reference, never row contents.
        run: |
          echo "pragmas: $(grep -c '^PRAGMA' prod.sql || true)"; grep '^PRAGMA' prod.sql || true
          npx --yes "$WRANGLER" d1 execute topogok-prod --remote --json --command "PRAGMA foreign_key_check" > fk.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('fk.json', 'utf8'))[0]?.results ?? [];
            const n = {}; for (const x of r) { const k = x.table + ' -> ' + x.parent; n[k] = (n[k] ?? 0) + 1; }
            console.log('broken references:', r.length, JSON.stringify(n));"
      - name: Replace the oldest backup
        run: |
          SLOT=$(( ( $(date -u +%s) / 604800 ) % 4 + 1 ))
          TARGET="topogok-backup-${SLOT}"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" > tables.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('tables.json', 'utf8'));
            const names = (r[0]?.results ?? []).map((x) => x.name);
            const sql = ['PRAGMA defer_foreign_keys = true;', ...names.map((n) => 'DROP TABLE IF EXISTS \"' + n.replace(/\"/g, '') + '\";')].join('\n');
            require('fs').writeFileSync('drop.sql', sql + '\n');
            console.log('dropping', names.length, 'tables');"
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --file drop.sql
          # The export writes each table followed by its rows, and D1 does not defer foreign key checks across
          # the whole file. So: every table first, then the rows in reference order (staff users, classes,
          # students, then the rest, which only reference users), the triggers last (users_scope_* read classes).
          node -e "
            const fs = require('fs');
            let sql = fs.readFileSync('prod.sql', 'utf8');
            const take = (re) => { const m = sql.match(re) ?? []; for (const s of m) sql = sql.replace(s, ''); return m; };
            const pragmas = take(/^PRAGMA[^\\n]*\\n/gim);
            const triggers = take(/CREATE TRIGGER[\\s\\S]*?\\bEND;/gi);
            const tables = take(/CREATE TABLE[\\s\\S]*?\\);(?=[ \\t]*(\\r?\\n|$))/gi);
            const users = take(/^INSERT INTO \\W?users\\W[^\\n]*\\n/gm);
            const classes = take(/^INSERT INTO \\W?classes\\W[^\\n]*\\n/gm);
            const student = (l) => /VALUES\\s*\\('[^']*',\\s*'student'/.test(l);
            const rows = [...users.filter((l) => !student(l)), ...classes, ...users.filter(student)];
            fs.writeFileSync('data.sql', pragmas.join('') + tables.join('\\n') + '\\n' + rows.join('') + sql);
            console.log('users', users.length, 'students', users.filter(student).length, 'classes', classes.length);
            fs.writeFileSync('triggers.sql', triggers.join('\\n') + '\\n');
            console.log('tables first:', tables.length, 'triggers last:', triggers.length);"
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --file data.sql
          if [ -s triggers.sql ]; then npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --file triggers.sql; fi
      - name: Verify row counts
        run: |
          Q="SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM classes) AS classes, (SELECT COUNT(*) FROM audit_log) AS audit"
          npx --yes "$WRANGLER" d1 execute topogok-prod --remote --json --command "$Q" > a.json
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --json --command "$Q" > b.json
          node -e "
            const f = (p) => JSON.stringify(JSON.parse(require('fs').readFileSync(p, 'utf8'))[0].results[0]);
            const a = f('a.json'), b = f('b.json');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Backup to ' + process.env.TARGET + ': production ' + a + ', backup ' + b + '\n');
            if (a !== b) { console.error('row counts differ', a, b); process.exit(1); }"
      - name: Remove the local export
        if: always()
        run: rm -f fk.json prod.sql data.sql triggers.sql a.json b.json tables.json drop.sql
