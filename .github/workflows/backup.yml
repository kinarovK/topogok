# Weekly backup of the production database into one of four rotating backup databases
# (topogok-backup-1..4, Cloudflare D1, free plan). Personal data stays within Cloudflare: the export
# exists only on this ephemeral runner and is never uploaded as an artifact. Restore: OPERATIONS.md.
name: backup

on:
  schedule:
    - cron: '17 2 * * 0'   # Sundays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: wrangler@4.160.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.23.4'
      - name: Export production
        run: npx --yes "$WRANGLER" d1 export topogok-prod --remote --output prod.sql
      - name: Replace the oldest backup
        run: |
          SLOT=$(( ( $(date -u +%s) / 604800 ) % 4 + 1 ))
          TARGET="topogok-backup-${SLOT}"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%'" > tables.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('tables.json', 'utf8'));
            const names = (r[0]?.results ?? []).map((x) => x.name);
            const sql = ['PRAGMA defer_foreign_keys = true;', ...names.map((n) => 'DROP TABLE IF EXISTS \"' + n.replace(/\"/g, '') + '\";')].join('\n');
            require('fs').writeFileSync('drop.sql', sql + '\n');
            console.log('dropping', names.length, 'tables');"
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --file drop.sql
          # The export creates each table's triggers before the later tables they read (users_scope_* read
          # classes), so inserting the users would fail with "no such table: main.classes". Load the tables and
          # rows first, the triggers last.
          node -e "
            const fs = require('fs');
            const sql = fs.readFileSync('prod.sql', 'utf8');
            const triggers = sql.match(/CREATE TRIGGER[\\s\\S]*?\\bEND;/gi) ?? [];
            fs.writeFileSync('data.sql', triggers.reduce((s, t) => s.replace(t, ''), sql));
            fs.writeFileSync('triggers.sql', triggers.join('\\n') + '\\n');
            console.log('triggers moved to the end:', triggers.length);"
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --file data.sql
          if [ -s triggers.sql ]; then npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --file triggers.sql; fi
      - name: Verify row counts
        run: |
          Q="SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM classes) AS classes, (SELECT COUNT(*) FROM audit_log) AS audit"
          npx --yes "$WRANGLER" d1 execute topogok-prod --remote --json --command "$Q" > a.json
          npx --yes "$WRANGLER" d1 execute "$TARGET" --remote --json --command "$Q" > b.json
          node -e "
            const f = (p) => JSON.stringify(JSON.parse(require('fs').readFileSync(p, 'utf8'))[0].results[0]);
            const a = f('a.json'), b = f('b.json');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Backup to ' + process.env.TARGET + ': production ' + a + ', backup ' + b + '\n');
            if (a !== b) { console.error('row counts differ', a, b); process.exit(1); }"
      - name: Remove the local export
        if: always()
        run: rm -f prod.sql data.sql triggers.sql a.json b.json tables.json drop.sql
